id: org.freedesktop.LinuxAudio.Plugins.Ratatouille
branch: '26.08'
build-extension: true
runtime: org.freedesktop.LinuxAudio.BaseExtension
runtime-version: stable
sdk: org.freedesktop.Sdk//26.08
build-options:
  prefix: /app/extensions/Plugins/Ratatouille
  prepend-pkg-config-path: /app/extensions/Plugins/Ratatouille/lib/pkgconfig
  env:
    AR: gcc-ar
cleanup:
  - /lib
modules:
  - shared-modules/linux-audio/lv2.json
  - name: ratatouille
    buildsystem: simple
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS lv2 clap vst2
      - mkdir -p ${FLATPAK_DEST}/lv2 ${FLATPAK_DEST}/clap ${FLATPAK_DEST}/vst
      - cp -r bin/Ratatouille.lv2 ${FLATPAK_DEST}/lv2
      - cp bin/Ratatouille.clap ${FLATPAK_DEST}/clap
      - cp bin/Ratatouillevst.so ${FLATPAK_DEST}/vst
    license-files:
      - LICENSE
      - NeuralAmpModelerCore/LICENSE
      - NeuralAmpModelerCore/Dependencies/AudioDSPTools/LICENSE
      - NeuralAmpModelerCore/Dependencies/eigen/LICENSE
      - libxputty/LICENSE
      - RTNeural/LICENSE
      - RTNeural/modules/xsimd/LICENSE
      - FFTConvolver/COPYING.txt
    post-install:
      - install -Dm644 org.freedesktop.LinuxAudio.Plugins.Ratatouille.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
    sources:
      - type: git
        url: https://github.com/brummer10/Ratatouille.lv2
        tag: v0.9.12
        commit: 44c905c77f1e4328b33efd915a24a39001125fe7
      - type: patch
        path: compiler-fixes.patch
      - type: file
        path: org.freedesktop.LinuxAudio.Plugins.Ratatouille.metainfo.xml
